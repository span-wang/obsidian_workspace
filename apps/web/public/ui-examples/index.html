<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>工作台 UI 风格示例</title>
    <style>
      :root { color: #202721; background: #f7f7f3; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { max-width: 900px; margin: 0 auto; padding: 64px 24px; }
      p, h1, h2 { margin: 0; }
      .eyebrow { color: #286348; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin-top: 10px; font-size: clamp(30px, 5vw, 52px); letter-spacing: -.04em; line-height: 1.1; }
      .intro { max-width: 52ch; margin-top: 12px; color: #6c716c; font-size: 14px; line-height: 1.7; }
      .directions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 42px; }
      .direction { display: flex; min-height: 170px; flex-direction: column; justify-content: space-between; padding: 20px; border: 1px solid #d8dad3; background: #fff; color: #202721; text-decoration: none; }
      .direction:hover { border-color: #286348; }
      .direction-b { background: #17231f; color: #f8faf7; }
      .direction-b:hover { border-color: #ad513a; }
      .direction h2 { font-size: 18px; }
      .direction p { margin-top: 7px; color: #6c716c; font-size: 13px; line-height: 1.55; }
      .direction-b p { color: #b9c7bf; }
      .direction span { color: #286348; font-size: 13px; font-weight: 700; }
      .direction-b span { color: #e48b74; }
      .note { margin-top: 28px; color: #6c716c; font-size: 12px; }
      @media (max-width: 620px) { body { padding: 38px 18px; } .directions { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <p class="eyebrow">Obsidian Platform · UI Preview</p>
    <h1>两个工作台方向</h1>
    <p class="intro">只用于确认视觉风格。页面里的按钮和筛选只改变本地展示状态，不连接后端。</p>
    <main class="directions">
      <a class="direction" href="./quiet-library.html"><div><h2>方向 A · Quiet Library</h2><p>克制的资料库工作台：左侧导航、扫描型结果、状态清晰。</p></div><span>打开方向 A ↗</span></a>
      <a class="direction direction-b" href="./focus-canvas.html"><div><h2>方向 B · Focus Canvas</h2><p>阅读优先的检索画布：结果与应用证据保持同屏。</p></div><span>打开方向 B ↗</span></a>
    </main>
    <p class="note">示例数据 · 确认方向后，再把选定部分接回现有 React 工作台。</p>
  </body>
</html>
