[project]
name = "obsidian-platform-service"
version = "0.1.0"
description = "Loopback service for the Obsidian personal knowledge platform"
requires-python = "==3.11.15"
dependencies = [
  "fastapi==0.139.2",
  "numpy==2.3.5",
  "olefile==0.47",
  "openpyxl==3.1.5",
  "paddleocr==3.7.0",
  "paddlepaddle-gpu==3.2.2",
  "paddlex[ocr]==3.7.2",
  "pypdf==6.14.2",
  "python-multipart==0.0.22",
  "python-docx==1.2.0",
  "sqlalchemy==2.0.51",
  "xlrd==2.0.1",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "ruff==0.14.8",
]

[[tool.uv.index]]
name = "paddle-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
